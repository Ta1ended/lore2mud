name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check repository safety
        run: python scripts/check_repo_safety.py --history

  windows-candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test Windows packaging
        run: python -m unittest tests.test_windows_packaging -v
      - name: Build clean candidate
        run: python packaging/windows/build_candidate.py
      - name: Verify repository-external cold start
        run: |
          $candidate = (Get-ChildItem dist/windows/lore2mud-windows-*.zip).FullName
          python packaging/windows/verify_candidate.py $candidate
