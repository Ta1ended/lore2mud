name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check repository safety
        run: python scripts/check_repo_safety.py --history

  windows-candidate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Windows build toolchain
        run: python -m pip install -r packaging/windows/requirements-build.txt
      - name: Test Windows packaging
        run: python -m unittest tests.test_windows_packaging -v
      - name: Build clean candidates
        run: |
          python packaging/windows/build_candidate.py --runtime pyinstaller
          python packaging/windows/build_candidate.py --runtime zipapp
      - name: Verify repository-external Web and console cold starts
        run: |
          Get-ChildItem dist/windows/lore2mud-windows-*.zip | ForEach-Object {
            python packaging/windows/verify_candidate.py $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
