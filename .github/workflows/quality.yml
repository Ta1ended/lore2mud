name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install quality tools
        run: python -m pip install --disable-pip-version-check -e ".[quality]"
      - name: Ruff
        run: python -m ruff check .
      - name: Pyright
        run: python -m pyright

  pytest:
    name: pytest (Python ${{ matrix.python-version }}, ${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            mode: serial
            pytest_args: ""
          - python-version: "3.12"
            mode: serial
            pytest_args: ""
          - python-version: "3.13"
            mode: xdist
            pytest_args: "-n auto"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install test tools
        run: python -m pip install --disable-pip-version-check -e ".[test]"
      - name: Run tests
        run: python -m pytest -q ${{ matrix.pytest_args }}
