[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lore2mud"
version = "0.1.0"
description = "A local-first, content-pack-driven text MUD starter."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "lore2mud contributors" },
]
keywords = ["mud", "text-game", "content-pipeline", "agent"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-xdist>=3.6,<4",
]
quality = [
  "pyright>=1.1.400,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
lore2mud = "lore2mud.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"lore2mud.web" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
addopts = "-ra"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]

[tool.ruff.lint.per-file-ignores]
"pipeline/adaptation.py" = ["E701", "E702"]
"tests/test_adaptation.py" = ["E402", "E701", "E702"]
"tests/test_registry_adaptation.py" = ["E402"]

[tool.pyright]
include = ["src/lore2mud"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportUnnecessaryTypeIgnoreComment = "error"
